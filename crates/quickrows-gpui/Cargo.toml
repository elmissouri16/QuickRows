[package]
name = "quickrows-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Fast native CSV viewer built with GPUI"

[lib]
name = "quickrows_gpui"
path = "src/lib.rs"

[[bin]]
name = "quickrows"
path = "src/main.rs"

[dependencies]
anyhow = "1"
directories = "6"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
quickrows-core.workspace = true
percent-encoding = "2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
futures-channel = "0.3"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSWindow",
    "block2",
    "objc2-uniform-type-identifiers",
    "std",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSArray",
    "NSString",
    "NSURL",
    "std",
] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = [
    "UTCoreTypes",
    "UTType",
    "std",
] }

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders", "test-support"] }
tempfile.workspace = true
