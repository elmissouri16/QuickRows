[workspace]
members = [
    "crates/quickrows-core",
    "crates/quickrows-gpui",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["@elmissouri16"]
repository = "https://github.com/elmissouri16/quickrows"
homepage = "https://github.com/elmissouri16/quickrows"

[workspace.dependencies]
csv = "1.3"
rayon = "1.8"
lru = "0.12"
libc = "0.2"
memmap2 = "0.9"
encoding_rs = "0.8"
chardetng = "0.1"
blake3 = "1"
reflink-copy = "0.1.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
quickrows-core = { path = "crates/quickrows-core" }
