name: Package smoke

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Validate release version
        run: python scripts/check-release-version.py
      - name: Install Linux package dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh --packaging
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build and verify macOS DMG
        if: runner.os == 'macOS'
        run: scripts/macos-dmg.sh --build-only --skip-tool-install
      - name: Build platform package
        if: runner.os != 'macOS'
        run: cargo packager --release --config packager.toml
      - name: Validate package artifacts
        run: python scripts/check-package-artifacts.py --os "${{ runner.os }}"
      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quickrows-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/*.dmg
            target/release/*.app.tar.gz
            target/release/*.msi
            target/release/*.exe
            !target/release/quickrows.exe
            target/release/*.deb
            target/release/*.AppImage
            target/release/*.tar.gz
