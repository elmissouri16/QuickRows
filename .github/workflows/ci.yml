name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting, lint, and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install Linux native dependencies and ShellCheck
        run: |
          scripts/install-linux-deps.sh
          sudo apt-get install -y shellcheck
      - name: Check release metadata
        run: python scripts/check-release-version.py
      - name: Test package artifact validation
        run: python scripts/tests/package-artifacts.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh scripts/lib/*.sh scripts/package/*.sh scripts/install/*.sh scripts/tests/*.sh
      - name: Check macOS packaging CLI
        run: scripts/tests/macos-dmg-cli.sh

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check workspace and benchmark targets
        run: cargo check --workspace --all-targets --locked
